<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2D Персонаж на Canvas</title>
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh; /* Высота на весь экран */
            margin: 0; /* Убираем стандартные отступы */
            background-color: #141414; /* Цвет фона страницы */
        }
        canvas {
            border: 1px solid black;
            background-color: #141414;
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas" width="800" height="600"></canvas>
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Переменные для персонажа
        const player = {
            x: canvas.width / 2,
            y: canvas.height / 2,
            width: 64,
            height: 64,
            speed: 10,
            image: new Image() // Создаем новую переменную для изображения
        };

        // Загрузка изображения
        player.image.src = 'froggyflies-1.png'; // Укажите путь к вашему изображению

        // Обработчик нажатий клавиш
        window.addEventListener('keydown', function(event) {
            // Используем event.code для определения нажатой клавиши
            switch(event.code) {
                case 'ArrowUp':
                case 'KeyW': // W для движения вверх
                    player.y -= player.speed;
                    break;
                case 'ArrowDown':
                case 'KeyS': // S для движения вниз
                    player.y += player.speed;
                    break;
                case 'ArrowLeft':
                case 'KeyA': // A для движения влево
                    player.x -= player.speed;
                    break;
                case 'ArrowRight':
                case 'KeyD': // D для движения вправо
                    player.x += player.speed;
                    break;
            }
            // Ограничим передвижение персонажа по границам canvas
            player.x = Math.max(0, Math.min(canvas.width - player.width, player.x));
            player.y = Math.max(0, Math.min(canvas.height - player.height, player.y));
        });

        // Функция отрисовки персонажа
        function drawPlayer() {
            ctx.drawImage(player.image, player.x, player.y, player.width, player.height); // Используем drawImage
        }

        // Основной игровой цикл
        function gameLoop() {
            ctx.clearRect(0, 0, canvas.width, canvas.height); // Очистка canvas
            drawPlayer(); // Рисуем персонажа
            requestAnimationFrame(gameLoop); // Запросить следующий кадр
        }

        // Запускаем игровой цикл после загрузки изображения
        player.image.onload = function() {
            gameLoop();
        };
    </script>
</body>
</html>
